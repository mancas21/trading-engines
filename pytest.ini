; pytest.ini — hace EXPLICITA la suite del motor, en vez de dejarla implicita.
;
; Sin este fichero, la suite que se ejecuta depende de en que directorio se
; invoque pytest y de que el arbol no gane un test nuevo en otro sitio (medido:
; hoy `pytest` a secas y `pytest reader scanner-engine` dan los mismos 258, pero
; eso era una coincidencia, no una garantia).
;
; Y en particular: quant-alert-engine es una app MANUAL y DESACOPLADA del motor
; (ver README-DESACOPLADO.md). Sus tests no forman parte de esta suite y no
; deben arrastrarse a ella.
;
; Uso:
;   pytest                      -> esta suite (reader + scanner-engine)
;   pytest path/al/test.py      -> sigue funcionando: testpaths solo aplica sin args
[pytest]
testpaths = reader scanner-engine
